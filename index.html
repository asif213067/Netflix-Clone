<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Netflix</title>
    <script src="script2.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>


<!--  ---------Navbar-----------  -->
    <div class="nav">
        <div class="nav_left">
            <a href="index.html"></a>
            <img class="nav_logo" src="images/logo2.png" alt="">
        </div>
        <div class="nav_right">
            <img class="nav_icon" src="images/icon.png" alt="">
        </div>
    </div>


<!--  ---------Banner-----------  -->
    <header id="banner">
        <div id="banner_contents">
            <h1 id="banner_title"></h1>
            <div id="banner_buttons">
                <button id="banner_button">Play</button>
                <button id="banner_button">My List</button>
            </div>
            <p id="banner_description"></p>
        </div>
        <div id="banner_fadeBottom">

        </div>
    </header>


<!--  --------row---------  -->
    <div id="headrow">
        <div class="row">
            <h1 class="row_title"></h1>
            <div class="row_posters">

            </div>
        </div>
    </div>


<script>

    window.addEventListener("scroll",function(){

        var nav = document.querySelector(".nav");
        nav.classList.toggle("active", window.scrollY > 0);
    })

</script>


</body>
</html>
